<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body class="page-auth">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">✦</span>
            <h1>Welcome Back</h1>
            <p>Sign in to continue your journey</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
        <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please login.</div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="username" placeholder="you@example.com" required class="form-input"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="form-input"/>
            </div>
            <button type="submit" class="btn-auth">Sign In →</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
