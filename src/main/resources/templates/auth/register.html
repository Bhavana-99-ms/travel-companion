<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body class="page-auth">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card auth-card-wide">
        <div class="auth-header">
            <span class="auth-icon">✦</span>
            <h1>Join WanderGuide</h1>
            <p>Create your account to start exploring</p>
        </div>

        <div th:if="${emailError}" class="alert alert-error" th:text="${emailError}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerDto}" class="auth-form">
            <!-- Role Toggle -->
            <div class="role-toggle">
                <input type="radio" name="role" id="roleUser" value="USER" checked class="role-radio"/>
                <label for="roleUser" class="role-label">
                    <span class="role-icon">🧳</span>
                    <span>I'm a Traveller</span>
                </label>
                <input type="radio" name="role" id="roleProvider" value="PROVIDER" class="role-radio"/>
                <label for="roleProvider" class="role-label">
                    <span class="role-icon">🗺️</span>
                    <span>I'm a Guide</span>
                </label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" placeholder="John Doe" class="form-input"/>
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" placeholder="you@example.com" class="form-input"/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" placeholder="Min 6 characters" class="form-input"/>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" th:field="*{phone}" placeholder="+91 9876543210" class="form-input"/>
                </div>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" th:field="*{city}" placeholder="Mumbai, Delhi, Goa..." class="form-input"/>
            </div>

            <button type="submit" class="btn-auth">Create Account →</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
